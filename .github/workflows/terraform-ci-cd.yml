name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
      - develop

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  resolve-env:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
    steps:
      - id: resolve
        run: |
          case "${GITHUB_REF_NAME}" in
            main)     echo "env=prod" >> "$GITHUB_OUTPUT" ;;
            staging)  echo "env=staging" >> "$GITHUB_OUTPUT" ;;
            develop)  echo "env=dev" >> "$GITHUB_OUTPUT" ;;
            *)        echo "env=dev" >> "$GITHUB_OUTPUT" ;;
          esac

  plan:
    name: Terraform Plan (${{ needs.resolve-env.outputs.env }})
    runs-on: ubuntu-latest
    needs: resolve-env
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::874632206426:role/github-actions-terraform-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init -backend-config=environments/backend-${{ needs.resolve-env.outputs.env }}.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file=environments/${{ needs.resolve-env.outputs.env }}.tfvars -out=tfplan -input=false

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.resolve-env.outputs.env }}
          path: tfplan
          retention-days: 1

  tfsec-scan:
    name: tfsec Security Scan
    runs-on: ubuntu-latest
    needs: [resolve-env, plan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tfsec
        run: |
          curl -s -L https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec
        run: tfsec . --exclude aws-ec2-no-public-ingress-sgr,aws-ec2-no-public-egress-sgr,aws-elb-http-not-used,aws-ec2-no-public-ip-subnet,aws-elb-alb-not-public,aws-ec2-require-vpc-flow-logs-for-all-vpcs,aws-rds-enable-performance-insights-encryption,aws-sns-topic-encryption-use-cmk,builtin.aws.rds.aws0177,aws-s3-encryption-customer-key,aws-s3-enable-bucket-logging,aws-rds-enable-performance-insights,aws-dynamodb-table-customer-key

  apply:
    name: Terraform Apply (${{ needs.resolve-env.outputs.env }})
    runs-on: ubuntu-latest
    needs: [resolve-env, plan, tfsec-scan]
    if: github.event_name == 'push'
    environment: ${{ needs.resolve-env.outputs.env == 'prod' && 'production' || needs.resolve-env.outputs.env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::874632206426:role/github-actions-terraform-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init -backend-config=environments/backend-${{ needs.resolve-env.outputs.env }}.hcl

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.resolve-env.outputs.env }}

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
