name: Terraform Destroy (dev/staging)

# Manual-only cleanup for the ephemeral dev/staging stacks used for demo
# screenshots/evidence. "prod" is intentionally NOT a selectable option here
# -- there is no path in this workflow that can ever destroy production.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - staging
      confirm:
        description: 'Type the environment name again to confirm (e.g. "dev")'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  guard:
    name: Confirm Target
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input matches selected environment
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "${{ github.event.inputs.environment }}" ]; then
            echo "Confirmation text does not match selected environment. Aborting."
            exit 1
          fi

  destroy:
    name: Terraform Destroy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: guard
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::874632206426:role/github-actions-terraform-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init -backend-config=environments/backend-${{ github.event.inputs.environment }}.hcl

      - name: Terraform Destroy
        run: terraform destroy -var-file=environments/${{ github.event.inputs.environment }}.tfvars -auto-approve
